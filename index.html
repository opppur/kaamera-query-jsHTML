<!doctype html>
<html>
  <head>
    <title>Kaamera Trips</title>
    <script>
      let player = null, c = null, g = null, g2 = null, span1 = null;

      const WIN_COMBOS = [
        [0, 1, 2], [3, 4, 5], [6, 7, 8], // read
        [0, 3, 6], [1, 4, 7], [2, 5, 8], // veerud
        [0, 4, 8], [2, 4, 6]             // diagonaalid
      ];

      function start() {
        player = document.getElementById("v1");
        c = document.getElementById("c1");
        g = c.getContext("2d");
        g2 = document.getElementById("c2").getContext("2d");
        span1 = document.getElementById("s1");

        navigator.mediaDevices.getUserMedia({video: {
    facingMode: { exact: "environment" }
  }}).then((stream) => {
          player.srcObject = stream;
        });

        setInterval(capture, 500);
      }

      function capture() {
        if (!player || player.readyState < 2) return;
        if (player.videoWidth && (c.width !== player.videoWidth || c.height !== player.videoHeight)) {
          c.width = player.videoWidth;
          c.height = player.videoHeight;
        }
        g.drawImage(player, 0, 0, c.width, c.height);

        const cellW = c.width / 3;
        const cellH = c.height / 3;
        const board = [];

        for (let row = 0; row < 3; row++) {
          for (let col = 0; col < 3; col++) {
            let cx = Math.floor((col + 0.5) * cellW);
            let cy = Math.floor((row + 0.5) * cellH);

            let imgData = g.getImageData(cx - 10, cy - 10, 20, 20);
            let color = detectColor(imgData.data);
            board.push(color);

            g.strokeStyle = color === "RED" ? "orange" : (color === "BLUE" ? "cyan" : "yellow");
            g.lineWidth = 2;
            g.strokeRect(cx - 10, cy - 10, 20, 20);

            if (color === "RED") {
              g.fillStyle = "red";
              g.font = "bold 28px Arial";
              g.fillText("X", cx - 10, cy + 10);
            } else if (color === "BLUE") {
              g.fillStyle = "blue";
              g.font = "bold 28px Arial";
              g.fillText("O", cx - 10, cy + 10);
            }
          }
        }

        g.strokeStyle = "white";
        g.lineWidth = 2;
        for (let i = 1; i < 3; i++) {

          g.beginPath();
          g.moveTo(i * cellW, 0);
          g.lineTo(i * cellW, c.height);
          g.stroke();

          g.beginPath();
          g.moveTo(0, i * cellH);
          g.lineTo(c.width, i * cellH);
          g.stroke();
        }
    
        let centerBoxData = g.getImageData(cellW + 33, cellH + 20, 40, 40);
        g2.putImageData(centerBoxData, 0, 0);

        let winner = checkWinner(board);
        displayStatus(board, winner);
      }

      function detectColor(data) {
        let rSum = 0, gSum = 0, bSum = 0;
        let total = data.length / 4;

        for (let i = 0; i < data.length; i += 4) {
          rSum += data[i];
          gSum += data[i + 1];
          bSum += data[i + 2];
        }

        let avgR = rSum / total;
        let avgG = gSum / total;
        let avgB = bSum / total;

        if (avgR > 100 && avgR > avgG + 25 && avgR > avgB + 25) {
          return "RED"; // Orange / Red detected (Player X)
        } else if (avgB > 100 && avgB > avgR + 25 && avgB > avgG + 25) {
          return "BLUE"; // Blue detected (Player O)
        }
        return "EMPTY";
      }

      function checkWinner(board) {
        for (let combo of WIN_COMBOS) {
          const [a, b, c] = combo;
          if (board[a] !== "EMPTY" && board[a] === board[b] && board[a] === board[c]) {
            return board[a];
          }
        }
        if (board.every(cell => cell !== "EMPTY")) return "DRAW";
        return null;
      }

      function displayStatus(board, winner) {
        let gridFormatted = board.map((val, idx) => {
          let mark = val === "RED" ? "X" : (val === "BLUE" ? "O" : ".");
          return mark + ((idx + 1) % 3 === 0 ? "<br/>" : " ");
        }).join("");

        let statusText = "<b>Board State:</b><br/>" + gridFormatted;
        if (winner === "RED") {
          statusText += "<br/><b style='color:red;'>PUNANE (X) VÕIT!</b>";
        } else if (winner === "BLUE") {
          statusText += "<br/><b style='color:blue;'>SININE (O) VÕIT!</b>";
        } else if (winner === "DRAW") {
          statusText += "<br/><b>VIIK</b>";
        } else {
          statusText += "<br/>Paiguta punased ristid või sinised ringid mängimiseks ruudustikku";
        }

        span1.innerHTML = statusText;
      }
    </script>
  </head>
  <body onload="start()">
    <video id="v1" controls autoplay style="width: 45%"></video>
    <canvas id="c1" width="320" height="240" style="width: 45%"></canvas><br />     
    <canvas id="c2" width="40" height="40"></canvas>    
    <span id="s1"></span>    
  </body>
</html>
