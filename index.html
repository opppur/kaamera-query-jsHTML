<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Kaamera Trips</title>
    <script>
      // ---------- Seaded ----------
      const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbw1d3h9bf6COxq-AeqSPXybz6FubC1CbrYa-tJAbWLOpoKAOqSVb7VY5Yh0DJ1GHaXrBA/exec"; // Apps Scripti veebirakenduse /exec aadress
      const HUMAN = "RED";        // inimene mängib punaste (X) tükkidega
      const COMPUTER = "BLUE";    // arvuti mängib siniste (O) tükkidega
      const FIRST = "RED";        // kes alustab (RED = X)
      const STABLE_FRAMES = 4;    // mitu järjestikust kaadrit (4 x 500 ms) peab laud samasugune olema

      const CELL_NAMES = [
        "üleval vasakul", "üleval keskel", "üleval paremal",
        "keskel vasakul", "keskel", "keskel paremal",
        "all vasakul", "all keskel", "all paremal"
      ];

      let player = null, c = null, g = null, span1 = null;

      // ---------- Mänguseis ----------
      let lastKey = null;       // viimase kaadri laud
      let stableCount = 0;      // mitu kaadrit järjest sama laud
      let acceptedKey = null;   // viimane stabiilne laud, mille kohta on serverilt küsitud
      let plan = null;          // {before, expected} – arvuti viimane soovitus (laua võtmed)
      let state = { kind: "init", board: Array(9).fill("EMPTY"), move: null, message: "" };

      function start() {
        player = document.getElementById("v1");
        c = document.getElementById("c1");
        g = c.getContext("2d");
        span1 = document.getElementById("s1");

        navigator.mediaDevices.getUserMedia({ video: { facingMode: { exact: "environment" } } })
          .catch(() => navigator.mediaDevices.getUserMedia({ video: true })) // varuvariant arvutile
          .then((stream) => { player.srcObject = stream; });

        setInterval(capture, 500);
      }

      // ---------- Kaamera lugemine ----------
      function capture() {
        if (!player || player.readyState < 2) return;
        if (player.videoWidth && (c.width !== player.videoWidth || c.height !== player.videoHeight)) {
          c.width = player.videoWidth;
          c.height = player.videoHeight;
        }
        g.drawImage(player, 0, 0, c.width, c.height);

        const cellW = c.width / 3;
        const cellH = c.height / 3;
        const board = [];

        // loe kõik ruudud ENNE joonistamist
        for (let row = 0; row < 3; row++) {
          for (let col = 0; col < 3; col++) {
            const cx = Math.floor((col + 0.5) * cellW);
            const cy = Math.floor((row + 0.5) * cellH);
            board.push(detectColor(g.getImageData(cx - 10, cy - 10, 20, 20).data));
          }
        }

        // reageeri alles siis, kui laud on mitu kaadrit järjest sama
        const key = board.join(",");
        if (key === lastKey) {
          stableCount++;
        } else {
          lastKey = key;
          stableCount = 1;
        }
        if (stableCount >= STABLE_FRAMES && key !== acceptedKey) {
          acceptedKey = key;
          handleBoard(board, key);
        }

        drawBoard(board, cellW, cellH);
      }

      function drawBoard(board, cellW, cellH) {
        for (let row = 0; row < 3; row++) {
          for (let col = 0; col < 3; col++) {
            const color = board[row * 3 + col];
            const cx = Math.floor((col + 0.5) * cellW);
            const cy = Math.floor((row + 0.5) * cellH);

            g.strokeStyle = color === "RED" ? "orange" : (color === "BLUE" ? "cyan" : "yellow");
            g.lineWidth = 2;
            g.strokeRect(cx - 10, cy - 10, 20, 20);

            if (color === "RED") {
              g.fillStyle = "red";
              g.font = "bold 28px Arial";
              g.fillText("X", cx - 10, cy + 10);
            } else if (color === "BLUE") {
              g.fillStyle = "blue";
              g.font = "bold 28px Arial";
              g.fillText("O", cx - 10, cy + 10);
            }
          }
        }

        g.strokeStyle = "white";
        g.lineWidth = 2;
        for (let i = 1; i < 3; i++) {
          g.beginPath();
          g.moveTo(i * cellW, 0);
          g.lineTo(i * cellW, c.height);
          g.stroke();

          g.beginPath();
          g.moveTo(0, i * cellH);
          g.lineTo(c.width, i * cellH);
          g.stroke();
        }

        // arvuti soovitatud käik: roheline katkendlik ring
        if (state.kind === "computer" && state.move != null) {
          const cx = ((state.move % 3) + 0.5) * cellW;
          const cy = (Math.floor(state.move / 3) + 0.5) * cellH;
          g.save();
          g.strokeStyle = "lime";
          g.lineWidth = 3 + 2 * Math.sin(Date.now() / 150);
          g.setLineDash([8, 6]);
          g.beginPath();
          g.arc(cx, cy, Math.min(cellW, cellH) * 0.3, 0, Math.PI * 2);
          g.stroke();
          g.restore();
        }
      }

      // ---------- Värvituvastus ----------
      function detectColor(data) {
        let rSum = 0, gSum = 0, bSum = 0;
        const total = data.length / 4;

        for (let i = 0; i < data.length; i += 4) {
          rSum += data[i];
          gSum += data[i + 1];
          bSum += data[i + 2];
        }

        const avgR = rSum / total;
        const avgG = gSum / total;
        const avgB = bSum / total;

        if (avgR > 100 && avgR > avgG + 25 && avgR > avgB + 25) {
          return "RED";   // Player X
        } else if (avgB > 100 && avgB > avgR + 25 && avgB > avgG + 25) {
          return "BLUE";  // Player O
        }
        return "EMPTY";
      }

      // ---------- Server (Google Apps Script) otsustab ----------
      async function handleBoard(board, key) {
        if (!SCRIPT_URL.startsWith("http")) {
          state = { kind: "error", board, move: null, message: "SCRIPT_URL on määramata." };
          displayStatus(state);
          return;
        }

        state = { kind: "thinking", board, move: null, message: "Mõtlen..." };
        displayStatus(state);

        const code = board.map(v => v === "RED" ? "X" : (v === "BLUE" ? "O" : "-")).join("");
        const url = SCRIPT_URL +
          "?board=" + code +
          "&me=" + (COMPUTER === "BLUE" ? "O" : "X") +
          "&first=" + (FIRST === "RED" ? "X" : "O");

        let d;
        try {
          d = await (await fetch(url)).json();
        } catch (err) {
          if (key !== acceptedKey) return;
          state = { kind: "error", board, move: null, message: "Serveriga ei saanud ühendust, proovin uuesti..." };
          displayStatus(state);
          setTimeout(() => { if (key === acceptedKey) acceptedKey = null; }, 3000); // luba kordus
          return;
        }
        if (key !== acceptedKey) return; // laud muutus vahepeal, vastus on aegunud

        // kas eelmine arvuti käik tehti soovitatud kohta?
        let warning = "";
        if (plan && key !== plan.expected && key !== plan.before) {
          warning = "<br/><i>Võimalik, et laud ei vasta soovitatud käigule.</i>";
        }

        if (d.status === "computer" && d.move >= 0 && d.move < 9 && board[d.move] === "EMPTY") {
          const expected = board.slice();
          expected[d.move] = COMPUTER;
          plan = { before: key, expected: expected.join(",") };
          state = {
            kind: "computer", board, move: d.move,
            message: "Minu käik: pane " + (COMPUTER === "BLUE" ? "SININE (O)" : "PUNANE (X)") +
                     " tükk ruutu <b>" + (d.move + 1) + "</b> (" + CELL_NAMES[d.move] + ")." + warning
          };
        } else if (d.status === "wait") {
          plan = null;
          state = {
            kind: "wait", board, move: null,
            message: "Sinu käik – pane " + (HUMAN === "RED" ? "punane (X)" : "sinine (O)") + " tükk lauale." + warning
          };
        } else if (d.status === "over") {
          plan = null;
          const msg = d.winner === "DRAW" ? "VIIK"
                    : d.winner === "X" ? "PUNANAST (X) mängiv mängija VÕIT!"
                    : "SINIST (O) mängiv arvuti Aadu VÕIT!";
          state = {
            kind: "over", board, move: null, message: msg,
            winner: d.winner === "DRAW" ? "DRAW" : (d.winner === "X" ? "RED" : "BLUE")
          };
        } else {
          state = {
            kind: "invalid", board, move: null,
            message: "Laud ei tundu õige (märkide arv ei klapi). Kontrolli tükke ja valgust."
          };
        }
        displayStatus(state);
      }

      // ---------- Kuvamine ----------
      function displayStatus(st) {
        const gridFormatted = st.board.map((val, idx) => {
          let mark = val === "RED" ? "X" : (val === "BLUE" ? "O" : ".");
          if (st.kind === "computer" && idx === st.move) mark = "<b style='color:green;'>[o]</b>";
          return mark + ((idx + 1) % 3 === 0 ? "<br/>" : " ");
        }).join("");

        let color = "black";
        if (st.kind === "over") color = st.winner === "RED" ? "red" : (st.winner === "BLUE" ? "blue" : "black");
        if (st.kind === "invalid" || st.kind === "error") color = "darkorange";

        let statusText = "<b>Board State:</b><br/>" + gridFormatted;
        statusText += "<br/><b style='color:" + color + ";'>" + st.message + "</b>";
        if (st.kind === "over") statusText += "<br/>Uue mängu alustamiseks tühjenda laud.";

        span1.innerHTML = statusText;
      }
    </script>
  </head>
  <body onload="start()">
    <video id="v1" controls autoplay playsinline style="width: 45%"></video>
    <canvas id="c1" width="320" height="240" style="width: 45%"></canvas><br />
    <span id="s1">Mängi trips-traps-trulli arvuti Aadu vastu. Paiguta punased ristid või sinised ringid mängimiseks ruudustikku</span><br />
    Sina alustad ja mängid punaste ristidega (X).
  </body>
</html>
